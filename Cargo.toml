[workspace]
resolver = "3"
members = ["crates/pps-api", "crates/pps-db", "crates/pps-domaine", "crates/pps-soin"]

[workspace.package]
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
axum = "0.8.9"
http-body-util = "0.1.5"
jiff = { version = "0.2.38", features = ["tzdb-bundle-always"] }
jiff-sqlx = { version = "0.2.0", features = ["postgres"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "macros", "migrate", "uuid", "sqlx-toml"] }
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "net", "signal", "time", "io-util"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["catch-panic", "limit", "request-id", "sensitive-headers", "set-header", "timeout", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1.28.0", features = ["v7"] }

pps-db = { path = "crates/pps-db" }
pps-domaine = { path = "crates/pps-domaine" }
pps-soin = { path = "crates/pps-soin" }

[workspace.lints.rust]
unsafe_code = "forbid"
non_ascii_idents = "deny"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Interdits dans le code de production (autorisés dans les tests, voir clippy.toml).
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
indexing_slicing = "deny"
print_stdout = "deny"
print_stderr = "deny"
# Bruit sans valeur pour des crates internes.
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
