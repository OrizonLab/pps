allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-indexing-slicing-in-tests = true
allow-dbg-in-tests = true

# Décision 0009 : uniquement les macros SQLx vérifiées à la compilation.
disallowed-methods = [
    { path = "sqlx::query", reason = "utiliser sqlx::query! (requête vérifiée à la compilation, décision 0009)" },
    { path = "sqlx::query_as", reason = "utiliser sqlx::query_as! (décision 0009)" },
    { path = "sqlx::query_scalar", reason = "utiliser sqlx::query_scalar! (décision 0009)" },
    { path = "sqlx::query_with", reason = "utiliser les macros vérifiées (décision 0009)" },
    { path = "sqlx::query_as_with", reason = "utiliser les macros vérifiées (décision 0009)" },
    { path = "sqlx::raw_sql", reason = "SQL non vérifié interdit (décision 0009)" },
]
