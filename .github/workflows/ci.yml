name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Nouvelle analyse chaque semaine : de nouvelles failles sont publiées même
  # quand le code ne change pas.
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Les macros SQLx utilisent le cache versionné dans `.sqlx/`.
  SQLX_OFFLINE: "true"

jobs:
  qualite:
    name: Formatage et lints
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Installer la toolchain épinglée (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  tests:
    name: Tests (PostgreSQL 18)
    runs-on: ubuntu-24.04
    services:
      postgres:
        # postgres:18.6-alpine3.24, même version que docker/postgres/Dockerfile
        image: postgres@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_USER: pps_ci
          POSTGRES_PASSWORD: pps_ci
          POSTGRES_DB: pps
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pps_ci -d pps"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://pps_ci:pps_ci@localhost:5432/pps
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Installer la toolchain épinglée (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Créer les rôles PostgreSQL de PPS (décision 0007)
        run: psql "$DATABASE_URL" -v bdd=pps -v mdp_migration=ci -v mdp_api=ci -f docker/postgres/roles.sql
      - run: cargo test --workspace --locked
      - name: Vérifier que le cache des requêtes SQLx est à jour
        env:
          SQLX_OFFLINE: "false"
        run: |
          cargo install sqlx-cli --version 0.9.0 --no-default-features --features postgres,rustls
          cargo sqlx migrate run --source migrations
          cargo sqlx prepare --workspace --check -- --all-targets

  dependances:
    name: Dépendances (failles, licences, sources)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny check

  images:
    name: Images Docker (construction et analyse)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - nom: pps-api
            fichier: docker/Dockerfile
            contexte: .
            args: BINAIRE=pps-api
          - nom: pps-postgres
            fichier: docker/postgres/Dockerfile
            contexte: docker/postgres
            args: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Construire l'image ${{ matrix.nom }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.contexte }}
          file: ${{ matrix.fichier }}
          build-args: ${{ matrix.args }}
          push: false
          load: true
          tags: ${{ matrix.nom }}:ci
      - name: Analyser les vulnérabilités (hautes et critiques bloquantes)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.nom }}:ci
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
