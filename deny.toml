# Politique des dépendances, vérifiée par `cargo deny check` en local et en CI.

[graph]
all-features = true

[advisories]
# Toute faille connue (RustSec) fait échouer la vérification.
version = 2
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.9
# Licences permissives compatibles avec un usage commercial fermé.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]

[licenses.private]
# Nos propres crates ne sont pas publiées.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Nos crates internes se référencent par chemin, sans version.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
